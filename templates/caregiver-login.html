
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Caregiver Login | Epilepsy Care</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f7fc;
            color: #333;
            line-height: 1.6;
        }

        /* HEADER */
        header {
            background-color: #2457a6;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* LOGIN CONTAINER */
        .container {
            max-width: 450px;
            margin: 60px auto;
            padding: 20px;
        }

        .login-card {
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .login-card h2 {
            text-align: center;
            color: #2457a6;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        /* FORM */
        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2457a6;
        }

        .forgot-password {
            display: block;
            text-align: right;
            margin-top: 8px;
            color: #2457a6;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* LOGIN BUTTON */
        button {
            width: 100%;
            padding: 12px;
            background-color: #2457a6;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #183f7d;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2457a6;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* FOOTER */
        footer {
            background-color: #2457a6;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 10px;
                padding: 18px;
            }

            nav a {
                margin: 0 8px;
            }

            .container {
                margin: 30px auto;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h2>Epilepsy Care System</h2>

        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('caregiver') }}">Dashboard</a>
        </nav>
    </header>

    <!-- LOGIN SECTION -->
    <div class="container">

        <div class="login-card">

            <h2>Caregiver Login</h2>

            <p class="description">
                Sign in to access your Epilepsy Care account.
            </p>

            <form id="caregiverLoginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                    <a href="#" class="forgot-password">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit">Login</button>

            </form>

            <a href="{{ url_for('home') }}" class="back-link">
                Back to Home
            </a>

        </div>

    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Epilepsy Care System. All Rights Reserved.</p>
    </footer>

</body>
</html>
