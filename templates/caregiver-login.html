<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caregiver Login | Epilepsy Care System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f7fc;
            color: #333;
        }

        header {
            background-color: #2457a6;
            color: white;
            padding: 20px 7%;
        }

        header h1 {
            margin-bottom: 8px;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 55px auto;
        }

        .login-card {
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .login-card h2 {
            color: #2457a6;
            text-align: center;
            margin-bottom: 12px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2457a6;
        }

        .login-button {
            width: 100%;
            background-color: #2457a6;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background-color: #173d79;
        }

        .forgot-password {
            text-align: right;
            margin-top: 12px;
        }

        .forgot-password a,
        .signup-link a {
            color: #2457a6;
            text-decoration: none;
        }

        .forgot-password a:hover,
        .signup-link a:hover {
            text-decoration: underline;
        }

        .signup-link {
            text-align: center;
            margin-top: 22px;
        }

        footer {
            background-color: #2457a6;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 60px;
        }

        @media (max-width: 600px) {
            header {
                padding: 20px 4%;
            }

            nav a {
                display: inline-block;
                margin: 8px 12px 0 0;
            }

            .login-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Epilepsy Care System</h1>
        <p>Caregiver Portal</p>

        <nav>
            <a href="../index.html">Home</a>
            <a href="caregiver.html">Dashboard</a>
        </nav>
    </header>

    <main class="container">

        <section class="login-card">

            <h2>Caregiver Login</h2>

            <p class="description">
                Sign in to access your caregiver account and
                monitor connected patients.
            </p>

            <form id="caregiverLoginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-button">Login</button>

                <div class="forgot-password">
                    <a href="#">Forgot Password?</a>
                </div>

            </form>

            <div class="signup-link">
                <p>
                    Don't have an account?
                    <a href="#">Contact your system administrator</a>
                </p>
            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Epilepsy Care System. All Rights Reserved.</p>
    </footer>
<script src="../js/script.js"></script>
</body>
</html>
